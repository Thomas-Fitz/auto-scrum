# auto-scrum configuration
project:
  name: my-project          # Display name for reports and artifacts
  user: developer           # Developer or team name

artifacts:
  # Root directory for all auto-scrum artifacts.
  #   ~/.auto-scrum — global, can span multiple repos (default)
  #   .auto-scrum   — project-relative, versioned alongside the repo
  base_dir: ~/.auto-scrum

# Subagent models & reasoning effort are NOT configured here. Each auto-scrum
# subagent role has an agent profile installed by as-setup (as-dev, as-reviewer,
# as-generic, as-architect, as-qa) whose frontmatter pins its model and effort —
# edit those files to change them. Run `bash <skills_dir>/as-setup/setup.sh` to
# see the resolved profile directory for your platform.
#
# Skills dispatch by subagent_type and never pass a model: parameter (a
# per-dispatch model would silently override the profile).
#
# The orchestrator runs on the session model, chosen in your harness (/model).

git:
  # task | story | epic | never (default: never)
  commit_frequency: never

pipeline:
  # Maximum dev/review loop iterations per story before the orchestrator
  # makes a judgment call and moves on.
  max_review_cycles: 3

auto_scrum:
  platform: copilot             # 'copilot' | 'claude' | 'opencode'
  skills_dir: ~/.copilot/skills # Path where auto-scrum skills are installed
                                # Set automatically by setup; update if you move your skills
                                # e.g. ~/.copilot/skills, ~/.claude/skills, ~/.config/opencode/skills
